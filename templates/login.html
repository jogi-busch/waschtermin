{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}
{% block content %}
<h1>{{ t('nav.login') }}</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>{{ t('f.email') }} <input type="email" name="email" required autofocus></label>
  <label>{{ t('login.password') }} <input type="password" name="password" required></label>
  <button class="btn">{{ t('nav.login') }}</button>
  <p class="muted">{{ t('login.no_account') }}
    <a href="{{ url_for('register', role='driver') }}">{{ t('login.driver') }}</a> ·
    <a href="{{ url_for('register', role='wash') }}">{{ t('login.wash') }}</a></p>
</form>
{% endblock %}
